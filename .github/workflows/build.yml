name: Build, test and tagged release
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: clickforge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore, build and run all local suites
        shell: pwsh
        run: ./build.ps1 -SkipPackage
      - name: Preserve Windows UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-diagnostics
          path: artifacts/logs/
          if-no-files-found: ignore
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'ojeshfrrr/ClickForge'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Reject existing releases and mismatched tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.ClickForgeVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and Version.props must match' }
          $response = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace it' }
          if (($response | Out-String) -notmatch 'HTTP 404') { throw 'Could not confirm that this release is new' }
          $global:LASTEXITCODE = 0
      - name: Build and validate the exact tagged package
        shell: pwsh
        run: ./scripts/Package-Release.ps1 -Strict
      - name: Verify the independent helper with disposable processes
        shell: pwsh
        run: ./scripts/Test-UpdateProcess.ps1 -PayloadDirectory artifacts/package
      - name: Verify real per-user installation, upgrade, shortcuts and uninstall
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.ClickForgeVersion
          ./scripts/Test-Installer.ps1 -ZipPath "artifacts/ClickForge-v$version-win-x64.zip"
      - name: Preserve installer and helper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            artifacts/installer-tests/**/results.txt
            artifacts/installer-tests/**/installed-ui-tests.txt
            artifacts/updater/logs/
          if-no-files-found: ignore
      - name: Upload draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $name = "ClickForge-v$version-win-x64.zip"
          $zip = "artifacts/$name"
          $setupName = "ClickForge-Setup-v$version.exe"
          $setup = "artifacts/$setupName"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $generated = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -X POST -f "tag_name=$tag" -f "target_commitish=$env:GITHUB_SHA" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Release notes generation failed' }
          $notes = "Windows x64. Recommended: run $setupName for a per-user installation with optional Desktop and Start menu shortcuts. Portable: extract $name and keep the helper next to ClickForge.exe. See docs/INSTALLING.md and docs/UPDATING.md. Build/test, installer lifecycle and package verification jobs passed. Unsigned release; SHA-256 is not publisher authentication. Source: $env:GITHUB_SHA`n`nSHA-256: $hash  $name`nSHA-256: $setupHash  $setupName`n`n" + $generated.body
          [IO.File]::WriteAllText('artifacts/release-notes.md', $notes)
          gh release create $tag $zip "$zip.sha256" $setup "$setup.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:GITHUB_SHA --draft --title "ClickForge $tag" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE) { throw 'Draft upload failed; inspect it before retrying' }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot verify uploaded assets' }
          foreach ($path in @($zip, "$zip.sha256", $setup, "$setup.sha256")) {
            $assetName = [IO.Path]::GetFileName($path)
            $asset = @($release.assets | Where-Object name -eq $assetName)
            $expectedHash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne (Get-Item $path).Length -or $asset[0].digest -cne "sha256:$expectedHash") { throw "Asset failed verification: $assetName; draft not published" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
